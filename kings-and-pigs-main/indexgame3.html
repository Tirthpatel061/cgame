<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Shooter Game</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #e2e8f0;  /* Light gray text */
        font-family: Arial, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      
      canvas {
        border: 2px solid white;
        width: 100vw;
        height: 500px;
        background: transparent;
        position: relative;
        z-index: 2;
        display: block;
        margin: 0;
      }
      
      /* Home Button */
      #homeButton {
        position: fixed;
        top: 20px;
        right: 20px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        z-index: 100;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      #homeButton:hover {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
      }
      
      #homeButton:active {
        transform: translateY(0);
      }
      
      .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100vw;
        position: relative;
        z-index: 2;
        margin: 0;
        padding: 0;
      }
      .health-display {
        width: 100%;  /* Added to make health display full width */
        margin-bottom: 10px;
        font-family: Arial, sans-serif;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
      }
      .bottom-content {
        width: 100%;  /* Changed from 1500px to 100% */
        min-height: 4px;
        background: transparent;
        padding: 0px;
        margin-top: -20px;
      }
      .chat-container {
        display: flex;
        width: 100%;
        height: 400px;
        margin-top: 0px;
        background: rgba(30, 41, 59, 0.85);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        animation: slideUp 12s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
        transform: translateY(100vh);
        opacity: 0;
        position: relative;
        z-index: 2;
      }
      .chat-container:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      }
      .chat-sidebar {
        width: 30%;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);  /* Dark blue gradient */
        padding: 25px;
        border-right: 1px solid rgba(148, 163, 184, 0.1);
        transition: background 0.3s ease;
      }
      .chat-sidebar:hover {
        background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      }
      .chat-main {
        width: 70%;
        display: flex;
        flex-direction: column;
        background: #1e293b;  /* Dark blue */
      }
      .chat-messages {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        background: #1e293b;
        transition: background 0.3s ease;
      }
      .chat-messages:hover {
        background: #334155;  /* Slightly lighter blue */
      }
      .chat-input {
        display: flex;
        padding: 20px;
        background: #0f172a;  /* Deep navy */
        border-top: 1px solid rgba(148, 163, 184, 0.1);
        transition: background 0.3s ease;
      }
      .chat-input:hover {
        background: #1e293b;
      }
      .send-button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);  /* Blue gradient */
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        color: white;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        transition: all 0.3s ease;
        font-size: 14px;
        min-width: 120px;
      }
      .send-button:hover {
        background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      }
      .send-button:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
      }
      .send-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      
      /* Status indicator */
      .status-indicator {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 12px;
        font-weight: bold;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .status-indicator.show {
        opacity: 1;
      }
      .status-indicator.success {
        background: rgba(16, 185, 129, 0.2);
        color: #10b981;
        border: 1px solid #10b981;
      }
      .status-indicator.error {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border: 1px solid #ef4444;
      }
      .status-indicator.info {
        background: rgba(59, 130, 246, 0.2);
        color: #3b82f6;
        border: 1px solid #3b82f6;
      }
      
      /* Code input enhancements */
      .code-input-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      
      /* Line numbers (optional enhancement) */
      .line-numbers {
        position: absolute;
        left: 0;
        top: 0;
        width: 40px;
        height: 100%;
        background: rgba(15, 23, 42, 0.8);
        border-right: 1px solid rgba(148, 163, 184, 0.2);
        padding: 20px 5px;
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        color: #64748b;
        line-height: 1.6;
        user-select: none;
        pointer-events: none;
        overflow: hidden;
      }
      .task-description {
        font-size: 16px;
        color: #e2e8f0;  /* Light gray */
        margin-bottom: 15px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      #taskDescription {
        width: 100%;
        height: 300px;
        border: none;
        resize: none;
        padding: 15px;
        font-family: 'Courier New', monospace;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.6;
        background: rgba(15, 23, 42, 0.95);  /* Much darker background */
        color: #ffffff;  /* White text */
        border-radius: 8px;
        border: 2px solid rgba(59, 130, 246, 0.5);
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }
      #taskDescription.error {
        background: rgba(15, 23, 42, 0.95);  /* Much darker background */
        color: #ff6b6b;  /* Brighter red for errors */
        font-weight: 700;
        border: 2px solid rgba(239, 68, 68, 0.7);
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
      }
      #taskDescription.error::placeholder {
        color: #9ca3af;
        font-weight: 700;
      }
      #userInput {
        width: 100%;
        height: 100%;
        border: none;
        resize: none;
        padding: 20px;
        font-family: 'Fira Code', monospace;
        font-size: 16px;  /* Increased from 14px to 16px */
        font-weight: 500;  /* Added medium weight for better readability */
        line-height: 1.6;
        background: rgba(30, 41, 59, 0.8);  /* Semi-transparent dark blue */
        color: #e2e8f0;  /* Light gray text */
        border-radius: 8px;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        tab-size: 4;
        white-space: pre;
        overflow-wrap: break-word;
      }
      #userInput:hover {
        background: rgba(51, 65, 85, 0.8);  /* Slightly lighter on hover */
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
      }
      #userInput:focus {
        outline: none;
        background: rgba(51, 65, 85, 0.8);
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2),
                    0 0 0 2px rgba(59, 130, 246, 0.3);  /* Blue focus ring */
      }
      .chat-history {
        margin-top: 20px;
        color: #666;
        font-style: italic;
      }
      h3 {
        margin: 0 0 20px 0;
        color: #e2e8f0;  /* Light gray */
        font-size: 20px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        position: relative;
        padding-bottom: 10px;
      }
      h3:after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 50px;
        height: 3px;
        background: linear-gradient(90deg, #3b82f6, #2563eb);  /* Blue gradient */
        border-radius: 3px;
      }
      .message {
        padding: 10px;
        margin: 5px 0;
        background: rgba(51, 65, 85, 0.5);  /* Semi-transparent dark blue */
        color: #e2e8f0;  /* Light gray text */
        border-radius: 4px;
      }
      .message-container {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
      }
      .code-input {
        width: 100%;
        height: 100%;
        border: none;
        resize: none;
        padding: 10px;
        font-family: monospace;
        font-size: 14px;
        box-sizing: border-box;
        background: transparent;
        color: #e2e8f0;
        outline: none; /* Removes the focus outline */
      }
      body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    background: transparent;
  }
  
  #background-3d {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    background: #000;
  }
  
  #background-3d iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
    transform: scale(1.08);
    transform-origin: center center;
  }

  #background-3d::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(3, 7, 18, 0.12) 0%, rgba(3, 7, 18, 0.3) 100%);
    pointer-events: none;
  }

  @keyframes slideUp {
    0% {
      transform: translateY(100vh);
      opacity: 0;
    }
    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }
  /* Scoreboard Styles */
  .scoreboard {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.92);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    animation: fadeIn 0.5s ease-in;
    backdrop-filter: blur(5px);
  }
  .scoreboard.show {
    display: flex;
  }
  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  .scoreboard-container {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 3px solid #3b82f6;
    border-radius: 20px;
    padding: 40px;
    max-width: 800px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 0 50px rgba(59, 130, 246, 0.5);
    animation: slideUpScoreboard 0.6s ease-out;
  }
  
  /* Scrollbar styling for scoreboard */
  .scoreboard-container::-webkit-scrollbar {
    width: 10px;
  }
  
  .scoreboard-container::-webkit-scrollbar-track {
    background: rgba(15, 23, 42, 0.5);
    border-radius: 10px;
  }
  
  .scoreboard-container::-webkit-scrollbar-thumb {
    background: #3b82f6;
    border-radius: 10px;
  }
  
  .scoreboard-container::-webkit-scrollbar-thumb:hover {
    background: #2563eb;
  }
  @keyframes slideUpScoreboard {
    from {
      transform: translateY(50px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }
  .scoreboard-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .scoreboard-title {
    font-size: 42px;
    font-weight: bold;
    color: #3b82f6;
    text-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
    margin-bottom: 10px;
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from {
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
    }
    to {
      text-shadow: 0 0 30px rgba(59, 130, 246, 1), 0 0 40px rgba(59, 130, 246, 0.8);
    }
  }
  .score-display {
    text-align: center;
    margin-bottom: 30px;
  }
  .score-value {
    font-size: 72px;
    font-weight: bold;
    color: #10b981;
    text-shadow: 0 0 30px rgba(16, 185, 129, 0.8);
    margin: 10px 0;
    animation: scorePulse 1.5s ease-in-out infinite;
  }
  @keyframes scorePulse {
    0%, 100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.05);
    }
  }
  .score-label {
    font-size: 24px;
    color: #94a3b8;
    margin-bottom: 5px;
  }
  .tasks-summary {
    margin-top: 30px;
  }
  .tasks-summary-title {
    font-size: 24px;
    color: #3b82f6;
    margin-bottom: 20px;
    text-align: center;
  }
  .task-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    margin: 10px 0;
    background: rgba(59, 130, 246, 0.1);
    border-left: 4px solid #10b981;
    border-radius: 8px;
    transition: all 0.3s ease;
    animation: taskSlideIn 0.5s ease-out;
    animation-fill-mode: both;
  }
  .task-item:hover {
    background: rgba(59, 130, 246, 0.2);
    transform: translateX(10px);
    box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
  }
  @keyframes taskSlideIn {
    from {
      opacity: 0;
      transform: translateX(-30px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }
  .task-item:nth-child(1) { animation-delay: 0.1s; }
  .task-item:nth-child(2) { animation-delay: 0.2s; }
  .task-item:nth-child(3) { animation-delay: 0.3s; }
  .task-item:nth-child(4) { animation-delay: 0.4s; }
  .task-item:nth-child(5) { animation-delay: 0.5s; }
  .task-item:nth-child(6) { animation-delay: 0.6s; }
  .task-item:nth-child(7) { animation-delay: 0.7s; }
  .task-item:nth-child(8) { animation-delay: 0.8s; }
  .task-name {
    font-size: 18px;
    color: #e2e8f0;
    font-weight: 500;
  }
  .task-status {
    font-size: 20px;
    color: #10b981;
    font-weight: bold;
  }
  .completion-message {
    text-align: center;
    font-size: 20px;
    color: #10b981;
    margin-top: 20px;
    padding: 15px;
    background: rgba(16, 185, 129, 0.1);
    border-radius: 10px;
    border: 2px solid #10b981;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 30px;
  }
  .stat-box {
    background: rgba(59, 130, 246, 0.15);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 2px solid rgba(59, 130, 246, 0.3);
    transition: all 0.3s ease;
  }
  .stat-box:hover {
    background: rgba(59, 130, 246, 0.25);
    border-color: #3b82f6;
    transform: scale(1.05);
  }
  .stat-value {
    font-size: 36px;
    font-weight: bold;
    color: #3b82f6;
    margin: 10px 0;
  }
  .stat-label {
    font-size: 16px;
    color: #94a3b8;
  }
  /* Action Buttons */
  .action-buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .action-btn {
    padding: 15px 40px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    min-width: 150px;
  }
  .action-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }
  .action-btn:active {
    transform: translateY(-1px);
  }
  .btn-home {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: white;
  }
  .btn-home:hover {
    background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
  }
  .btn-retry {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
  }
  .btn-retry:hover {
    background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
  }
  .btn-new-level {
    background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
    color: white;
  }
  .btn-new-level:hover {
    background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
  }
  .btn-error-history {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    color: white;
  }
  .btn-error-history:hover {
    background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
  }
  /* Error History Modal */
  .error-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.92);
    z-index: 3000;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease-in;
    backdrop-filter: blur(5px);
  }
  .error-modal.show {
    display: flex;
  }
  .error-modal-container {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 3px solid #f59e0b;
    border-radius: 20px;
    padding: 30px;
    max-width: 900px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 0 50px rgba(245, 158, 11, 0.5);
    animation: slideUpScoreboard 0.4s ease-out;
  }
  .error-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid rgba(245, 158, 11, 0.3);
  }
  .error-modal-title {
    font-size: 32px;
    font-weight: bold;
    color: #f59e0b;
    text-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
  }
  .error-modal-close {
    background: transparent;
    border: 2px solid #f59e0b;
    color: #f59e0b;
    font-size: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .error-modal-close:hover {
    background: #f59e0b;
    color: #0f172a;
    transform: rotate(90deg);
  }
  .error-list {
    margin-top: 20px;
  }
  .error-item {
    background: rgba(245, 158, 11, 0.1);
    border-left: 4px solid #f59e0b;
    border-radius: 8px;
    padding: 15px;
    margin: 15px 0;
    transition: all 0.3s ease;
  }
  .error-item:hover {
    background: rgba(245, 158, 11, 0.2);
    transform: translateX(5px);
    box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
  }
  .error-task-name {
    font-size: 18px;
    font-weight: bold;
    color: #f59e0b;
    margin-bottom: 8px;
  }
  .error-message {
    font-size: 14px;
    color: #e2e8f0;
    font-family: 'Courier New', monospace;
    white-space: pre-wrap;
    background: rgba(0, 0, 0, 0.3);
    padding: 10px;
    border-radius: 5px;
    margin-top: 8px;
  }
  .error-timestamp {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 8px;
    font-style: italic;
  }
  .no-errors {
    text-align: center;
    padding: 40px;
    color: #94a3b8;
    font-size: 18px;
  }

  /* Video Modal */
  #videoModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.98);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  #videoModal.show {
    display: flex;
  }
  #videoContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #tutorialVideo {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: transparent;
  }
  #closeVideo {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #ef4444;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.3s;
    z-index: 1001;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  }

    <script src="../Login Module/database_connector.js"></script>
    <script>
      // Level progression system
      const LEVEL_STORAGE_KEY = 'cGameLevelProgress';
      const CURRENT_LEVEL = 3;
      const GAME_START_TIME = Date.now();
      let levelResultSaved = false;
      
      // Get level progress from localStorage
      function getLevelProgress() {
        const saved = localStorage.getItem(LEVEL_STORAGE_KEY);
        if (saved) {
          return JSON.parse(saved);
        }
        return {
          unlockedLevels: [1],
          completedLevels: [],
          currentLevel: 1
        };
      }
      
      // Save level progress to localStorage
      function saveLevelProgress(progress) {
        localStorage.setItem(LEVEL_STORAGE_KEY, JSON.stringify(progress));
      }
      
      // Mark current level as completed and unlock next level
      function completeCurrentLevel() {
        const progress = getLevelProgress();
        
        // Mark current level as completed
        if (!progress.completedLevels.includes(CURRENT_LEVEL)) {
          progress.completedLevels.push(CURRENT_LEVEL);
        }
        
        // Unlock next level
        const nextLevel = CURRENT_LEVEL + 1;
        if (nextLevel <= 8 && !progress.unlockedLevels.includes(nextLevel)) {
          progress.unlockedLevels.push(nextLevel);
        }
        
        // Update current level
        progress.currentLevel = Math.max(progress.currentLevel, nextLevel);
        
        saveLevelProgress(progress);
        
        console.log(`Level ${CURRENT_LEVEL} completed! Next level unlocked: ${nextLevel}`);
      }
      
      const canvas = document.getElementById('gameCanvas');
      canvas.width = window.innerWidth;
      canvas.height = 500;
      const ctx = canvas.getContext('2d');
      
      // Update canvas size on window resize
      window.addEventListener('resize', function() {
        canvas.width = window.innerWidth;
        canvas.height = 500;
      });
      
      // Load all character images
      const playerImage = new Image();
      playerImage.src = './img/Character_1.png';  // Default standing image
      
      const computerImage = new Image();
      computerImage.src = './img/Character_2.png';
      
      const backgroundImage = new Image();
      backgroundImage.src = './img/backgroundLevel1.png';
      
      const player = {
        x: 50,
        y: 270,
        width: 56,
        height: 71,
        health: 100,
        color: '#3498db',
        isAnimating: false,
        currentFrame: 0,
        currentSequence: 0,
        animationFrames: null,  // No animation frames
        lastFrameTime: 0
      };

      const computer = {
        x: 0, // Will be set dynamically
        y: 260,
        width: 70,
        height: 85,
        health: 100,
        color: '#e74c3c',
        isAnimating: false,
        currentFrame: 0,
        currentSequence: 0,
        animationFrames: null,  // No animation frames
        lastFrameTime: 0
      };
      
      // Update computer position based on canvas width
      function updateComputerPosition() {
        computer.x = canvas.width - 167;
      }
      updateComputerPosition();
      
      // Update computer position on resize
      window.addEventListener('resize', updateComputerPosition);

      const bullets = [];
      const computerBullets = [];
      
      // Track completed tasks and errors
      const gameState = {
        completedTasks: [],
        totalTasks: 5, // Set to 5 tasks per level
        currentTaskNumber: 0,
        errors: [], // Store errors locally
        gameEnded: false, // Flag to prevent fetching new tasks when game ends
        computerDead: false, // Flag to track if computer is dead
        currentLevel: 3 // Track current level
      };

      function drawBlock(block) {
        // Always draw default standing image (no animation)
        const image = block === player ? playerImage : computerImage;
        if (image.complete && image.naturalWidth > 0) {
          ctx.drawImage(image, block.x, block.y, block.width, block.height);
        }

        // Draw health bar - modified to maintain consistent width
        const healthPercent = block.health / (block === computer ? 100 : 100); // Both now use 100 as max
        const healthBarWidth = block.width; // Keep bar width same as block width
        const healthBarHeight = 10;
        const healthBarY = block.y - 20;
        
        // Background of health bar (empty part)
        ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.fillRect(block.x, healthBarY, healthBarWidth, healthBarHeight);
        
        // Filled part of health bar
        ctx.fillStyle = `rgb(${255 * (1 - healthPercent)}, ${255 * healthPercent}, 0)`;
        ctx.fillRect(block.x, healthBarY, healthBarWidth * healthPercent, healthBarHeight);
        
        // Border of health bar
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(block.x, healthBarY, healthBarWidth, healthBarHeight);
      }

      function drawBullet(bullet) {
        ctx.save();
        const trailLength = 5;
        for(let i = 0; i < trailLength; i++) {
          const trailPos = {
            x: bullet.x - (bullet.vx * i * 2),
            y: bullet.y
          };
          ctx.beginPath();
          ctx.fillStyle = `rgba(100, 100, 100, ${(trailLength - i) / trailLength * 0.3})`;
          ctx.arc(trailPos.x, trailPos.y, 2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.fillStyle = '#FFD700';
        const bulletLength = 12;
        const bulletWidth = 3;
        const angle = bullet.vx > 0 ? 0 : Math.PI;
        ctx.translate(bullet.x, bullet.y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(-bulletLength/2, 0);
        ctx.lineTo(bulletLength/2, 0);
        ctx.lineTo(bulletLength/2 - 2, -bulletWidth);
        ctx.lineTo(-bulletLength/2, -bulletWidth);
        ctx.lineTo(-bulletLength/2, 0);
        ctx.fill();

        // Add glow effect
        const gradient = ctx.createLinearGradient(
          -bulletLength/2, -bulletWidth,
          bulletLength/2, 0
        );
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0.2)');
        
        ctx.fillStyle = gradient;
        ctx.fill();

        // Add muzzle flash near the shooter
        if (bullet.vx > 0 && bullet.x < player.x + player.width + 50 ||
            bullet.vx < 0 && bullet.x > computer.x - 50) {
          ctx.beginPath();
          const flashSize = Math.random() * 5 + 10;
          ctx.fillStyle = 'rgba(255, 200, 0, 0.6)';
          ctx.arc(bullet.vx > 0 ? -bulletLength : bulletLength, 0, flashSize, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function updateHealth() {
        const playerHealthElement = document.getElementById('playerHealth');
        const computerHealthElement = document.getElementById('computerHealth');
        
        if (playerHealthElement) {
          playerHealthElement.textContent = player.health;
        }
        if (computerHealthElement) {
          computerHealthElement.textContent = computer.health;
        }
        
        // Add visual feedback for health changes
        if (player.health < 100) {
          player.color = `rgb(${255 * (1 - player.health/100)}, ${255 * (player.health/100)}, 0)`;
        }
        if (computer.health < 100) {
          computer.color = `rgb(${255 * (1 - computer.health/100)}, ${255 * (computer.health/100)}, 0)`;
        }
      }

      function checkCollision(bullet, block) {
        // Add a smaller hitbox for more precise collision
        const hitboxPadding = 10;
        const blockHitbox = {
          x: block.x + hitboxPadding,
          y: block.y + hitboxPadding,
          width: block.width - (hitboxPadding * 2),
          height: block.height - (hitboxPadding * 2)
        };
        
        return bullet.x >= blockHitbox.x && 
               bullet.x <= blockHitbox.x + blockHitbox.width &&
               bullet.y >= blockHitbox.y && 
               bullet.y <= blockHitbox.y + blockHitbox.height;
      }

      function createHitEffect(x, y) {
        const particles = [];
        const particleCount = 8;
        
        for (let i = 0; i < particleCount; i++) {
          const angle = (Math.PI * 2 * i) / particleCount;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * 2,
            vy: Math.sin(angle) * 2,
            life: 1
          });
        }
        
        return particles;
      }

      function gameLoop() {
        // Stop game loop if game has ended
        if (gameState.gameEnded) {
          return;
        }
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw background
        ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
        
        drawBlock(player);
        drawBlock(computer);

        // Update and draw hit effects
        if (window.hitEffects) {
          for (let i = window.hitEffects.length - 1; i >= 0; i--) {
            const particle = window.hitEffects[i];
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.life -= 0.05;
            
            if (particle.life <= 0) {
              window.hitEffects.splice(i, 1);
              continue;
            }
            
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 200, 0, ${particle.life})`;
            ctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Update player bullets
        for(let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];
          bullet.x += bullet.vx;
          drawBullet(bullet);

          if(checkCollision(bullet, computer)) {
            // Ensure health doesn't go below 0
            computer.health = Math.max(0, computer.health - 20);
            
            // Create hit effect
            window.hitEffects = (window.hitEffects || []).concat(
              createHitEffect(bullet.x, bullet.y)
            );
            
            // Remove the bullet
            bullets.splice(i, 1);
            
            // Screen shake
            canvas.style.transform = 'translateX(-4px)';
            setTimeout(() => {
              canvas.style.transform = 'none';
            }, 50);
            
            // Update health display
            updateHealth();
            continue;
          }

          // Remove bullets that go off screen
          if(bullet.x > canvas.width) {
            bullets.splice(i, 1);
          }
        }

        // Update computer bullets
        for(let i = computerBullets.length - 1; i >= 0; i--) {
          const bullet = computerBullets[i];
          bullet.x += bullet.vx;
          drawBullet(bullet);

          if(checkCollision(bullet, player)) {
            // Ensure health doesn't go below 0
            const damage = typeof bullet.damage === 'number' ? bullet.damage : 5;
            player.health = Math.max(0, player.health - damage);
            
            // Create hit effect
            window.hitEffects = (window.hitEffects || []).concat(
              createHitEffect(bullet.x, bullet.y)
            );
            
            // Remove the bullet
            computerBullets.splice(i, 1);
            
            // Screen shake
            canvas.style.transform = 'translateX(4px)';
            setTimeout(() => {
              canvas.style.transform = 'none';
            }, 50);
            
            // Update health display
            updateHealth();
            continue;
          }

          // Remove bullets that go off screen
          if(bullet.x < 0) {
            computerBullets.splice(i, 1);
          }
        }

        if(player.health <= 0 && !gameState.gameEnded) {
          // Show scoreboard with game over result
          gameState.gameEnded = true;
          showScoreboard('Game Over! Computer Wins!', false);
          resetGame();
        }
        if(computer.health <= 0 && !gameState.gameEnded) {
          // Computer dies - stop fetching new tasks and show scoreboard
          gameState.gameEnded = true;
          gameState.computerDead = true;
          
          showScoreboard('Congratulations! You Win!', true);
          resetGame();
        }

        requestAnimationFrame(gameLoop);
      }

      function resetGame() {
        // Don't reset health if game has ended - keep the final state
        if (!gameState.gameEnded) {
        player.health = 100;
        computer.health = 100;
        }
        bullets.length = 0;
        computerBullets.length = 0;
        updateHealth();
      }

      // Add this new function to handle shooting
      function shootBullet() {
        if (!player.isAnimating) {
          player.isAnimating = true;
          player.currentFrame = 0;
          player.currentSequence = 0;
          player.lastFrameTime = Date.now();
          
          bullets.push({
            x: player.x + player.width,
            y: player.y + player.height/2,
            vx: 15
          });
          
          canvas.style.transform = 'translateX(2px)';
          setTimeout(() => {
            canvas.style.transform = 'none';
          }, 50);

          setTimeout(() => {
            player.currentSequence = 1;
            player.currentFrame = 0;
          }, 5 * 333);

          setTimeout(() => {
            player.isAnimating = false;
            player.currentFrame = 0;
            player.currentSequence = 0;
          }, 10 * 333);
        }
      }

      // Add this function to handle enemy shooting
      function enemyShoot(damage = 5) {
        computer.isAnimating = true;
        computerBullets.push({
          x: computer.x,
          y: computer.y + computer.height/2,
          vx: -15,
          damage: damage
        });
        
        canvas.style.transform = 'translateX(-2px)';
        setTimeout(() => {
          canvas.style.transform = 'none';
        }, 50);

        setTimeout(() => {
          computer.isAnimating = false;
        }, 200);
      }

      function applyPlayerDamage(damage) {
        player.health = Math.max(0, player.health - damage);
        updateHealth();
      }

      // Function to show status indicator
      function showStatus(message, type = 'info', duration = 3000) {
        const indicator = document.getElementById('statusIndicator');
        indicator.textContent = message;
        indicator.className = `status-indicator show ${type}`;
        
        setTimeout(() => {
          indicator.classList.remove('show');
        }, duration);
      }
      
      // Enhanced submit function with better user feedback
      async function submitCode() {
        const userCode = document.getElementById('userInput').value.trim();
        const taskBox = document.getElementById('taskDescription');
        const currentChallenge = taskBox.value.split('\n\n')[0];
        const submitBtn = document.getElementById('submitBtn');
        
        if (!userCode) {
          showStatus('Please write some code first!', 'error');
          return;
        }
        
        // Disable submit button during processing
        submitBtn.disabled = true;
        submitBtn.textContent = 'Compiling...';
        showStatus('Compiling your code...', 'info');
        
        const taskNumber = parseInt(currentChallenge.match(/^\d+/)) || 0;

        try {
          const response = await fetch('http://localhost:5000/evaluate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ code: userCode })
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const result = await response.json();
          const isSuccess = result.success === true ||
            (result.result && (result.result.includes('Success') || result.result.includes('Completed')));
          
          // For all tasks (including 5th), show normal result
          taskBox.value = 
              currentChallenge + '\n\n' +
              '----------------------------------------\n' +
              'Compilation Result:\n' + 
              result.result;

          if (window.dbConnector) {
            window.dbConnector.saveCodeSubmission(CURRENT_LEVEL, taskNumber, userCode, result.result, '');
          }
          
          // If there's an error, store it and make enemy shoot
          if (!isSuccess) {
            enemyShoot(0);  // Visual shot on error
            applyPlayerDamage(5);
            showStatus('Compilation failed!', 'error');
            
            // Store error locally
            gameState.errors.push({
              task: currentChallenge,
              error: result.result,
              taskNumber: taskNumber,
              timestamp: new Date().toLocaleTimeString()
            });
            
            await fetch('http://localhost:5000/store_error', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ 
                error: result.result,
                task_number: taskNumber
              })
            });
          }
          
          // If successful, shoot bullet and prepare for next challenge
          if (isSuccess) {
            // Track completed task first
            if (!gameState.completedTasks.includes(currentChallenge)) {
              gameState.completedTasks.push(currentChallenge);
              gameState.currentTaskNumber++;
            }

            if (taskNumber === 1 && window.dbConnector && !localStorage.getItem('level1Task1Saved')) {
              window.dbConnector.saveTaskCompletion(CURRENT_LEVEL, taskNumber, userCode, true);
              localStorage.setItem('level1Task1Saved', 'true');
            }
            
            // Check if this is the 5th task (final task)
            const isFinalTask = gameState.completedTasks.length >= 5;
            
            if (isFinalTask) {
              // For 5th task: Special victory sequence
              showStatus('🎉 Victory! Final task completed! 🎉', 'success');
              
              // Shoot bullet and kill enemy immediately
              shootBullet();
              
              // Wait for bullet animation, then show victory
              setTimeout(() => {
                // Kill the computer warrior dramatically
                computer.health = 0;
                updateHealth();
                
                // End the game
                gameState.gameEnded = true;
                gameState.computerDead = true;
                
                // Mark level as completed
                completeCurrentLevel();
                
                // Show victory scoreboard
                setTimeout(() => {
                  showScoreboard('🎉 Victory! Warrior Defeats Enemy! 🎉', true);
                }, 500);
              }, 1000);
              
              // Clear input and don't fetch next task
              document.getElementById('userInput').value = '';
            } else {
              // For tasks 1-4: Normal behavior
              shootBullet();
              showStatus('Success! Code compiled and executed!', 'success');
              document.getElementById('userInput').value = '';
              
              // Fetch next task after delay
              setTimeout(fetchTask, 2000);
            }
          }
        } catch (error) {
          console.error('Error submitting code:', error);
          const errorMessage = 'Failed to submit code: ' + error.message;
          
          // Make enemy shoot on error
          enemyShoot(0);
          applyPlayerDamage(5);
          showStatus('Connection error!', 'error');
          
          // Store the error locally
          gameState.errors.push({
            task: currentChallenge,
            error: errorMessage,
            taskNumber: taskNumber,
            timestamp: new Date().toLocaleTimeString()
          });
          
          // Store the error on server
          try {
            await fetch('http://localhost:5000/store_error', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ 
                error: errorMessage,
                task_number: taskNumber
              })
            });
          } catch (e) {
            console.error('Failed to store error:', e);
          }

          taskBox.value = 
              currentChallenge + '\n\n' +
              '----------------------------------------\n' +
              'Connection Error:\n' +
              'Failed to submit code. Please check:\n' +
              '1. Server is running at http://localhost:5000\n' +
              '2. Code has no syntax errors\n' +
              '3. Network connection is stable\n\n' +
              'Technical details: ' + error.message + '\n\n' +
              'Try using "Run Code" for local syntax checking first.';
        } finally {
          // Re-enable submit button
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit & Compile';
        }
      }

      // Add event listener for submit button
      document.querySelector('#submitBtn').addEventListener('click', submitCode);
      
      // Add event listeners for new buttons
      document.querySelector('#runBtn').addEventListener('click', runCodeLocally);
      document.querySelector('#clearBtn').addEventListener('click', clearCode);
      
      // Add keyboard shortcuts
      document.getElementById('userInput').addEventListener('keydown', function(e) {
        // Ctrl+Enter to submit
        if (e.ctrlKey && e.key === 'Enter') {
          e.preventDefault();
          submitCode();
        }
        
        // Ctrl+R to run locally
        if (e.ctrlKey && e.key === 'r') {
          e.preventDefault();
          runCodeLocally();
        }
        
        // Tab key for indentation
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = this.selectionStart;
          const end = this.selectionEnd;
          
          // Insert tab character
          this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
          
          // Move cursor
          this.selectionStart = this.selectionEnd = start + 4;
        }
        
        // Auto-closing brackets and quotes
        const pairs = {
          '(': ')',
          '[': ']',
          '{': '}',
          '"': '"',
          "'": "'"
        };
        
        if (pairs[e.key]) {
          const start = this.selectionStart;
          const end = this.selectionEnd;
          const selectedText = this.value.substring(start, end);
          
          // If text is selected, wrap it
          if (start !== end) {
            e.preventDefault();
            this.value = this.value.substring(0, start) + e.key + selectedText + pairs[e.key] + this.value.substring(end);
            this.selectionStart = start + 1;
            this.selectionEnd = end + 1;
          }
          // If no selection, just add the pair
          else {
            e.preventDefault();
            this.value = this.value.substring(0, start) + e.key + pairs[e.key] + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 1;
          }
        }
      });
      
      // Function to clear code
      function clearCode() {
        const userInput = document.getElementById('userInput');

      // Enhanced C syntax validation function
      function validateCSyntax(code) {
        const errors = [];
        const warnings = [];
        const lines = code.split('\n');
        
        // Check for basic C structure
        if (!code.includes('#include')) {
          errors.push('⚠️  Missing #include directive (e.g., #include <stdio.h>)');
        }
        
        if (!code.includes('int main')) {
          errors.push('⚠️  Missing main function declaration (int main())');
        }
        
        // Check for balanced braces, parentheses, and brackets
        let braceCount = 0;
        let parenCount = 0;
        let bracketCount = 0;
        let inString = false;
        let inChar = false;
        let inComment = false;
        let inLineComment = false;
        
        for (let i = 0; i < code.length; i++) {
          const char = code[i];
          const nextChar = code[i + 1];
          
          // Handle comments
          if (!inString && !inChar) {
            if (char === '/' && nextChar === '*') {
              inComment = true;
              i++; // Skip next character
              continue;
            }
            if (char === '*' && nextChar === '/') {
              inComment = false;
              i++; // Skip next character
              continue;
            }
            if (char === '/' && nextChar === '/') {
              inLineComment = true;
              continue;
            }
          }
          
          if (char === '\n') {
            inLineComment = false;
          }
          
          if (inComment || inLineComment) continue;
          
          // Handle strings and characters
          if (char === '"' && !inChar) {
            inString = !inString;
            continue;
          }
          if (char === "'" && !inString) {
            inChar = !inChar;
            continue;
          }
          
          if (inString || inChar) continue;
          
          // Count brackets
          if (char === '{') braceCount++;
          if (char === '}') braceCount--;
          if (char === '(') parenCount++;
          if (char === ')') parenCount--;
          if (char === '[') bracketCount++;
          if (char === ']') bracketCount--;
        }
        
        if (braceCount > 0) {
          errors.push(`⚠️  Missing ${braceCount} closing curly brace(s) }`);
        } else if (braceCount < 0) {
          errors.push(`⚠️  Extra ${Math.abs(braceCount)} closing curly brace(s) }`);
        }
        
        if (parenCount > 0) {
          errors.push(`⚠️  Missing ${parenCount} closing parenthesis(es) )`);
        } else if (parenCount < 0) {
          errors.push(`⚠️  Extra ${Math.abs(parenCount)} closing parenthesis(es) )`);
        }
        
        if (bracketCount > 0) {
          errors.push(`⚠️  Missing ${bracketCount} closing square bracket(s) ]`);
        } else if (bracketCount < 0) {
          errors.push(`⚠️  Extra ${Math.abs(bracketCount)} closing square bracket(s) ]`);
        }
        
        // Check for common missing semicolons
        lines.forEach((line, index) => {
          const trimmed = line.trim();
          if (trimmed && 
              !trimmed.startsWith('#') && 
              !trimmed.startsWith('//') && 
              !trimmed.startsWith('/*') && 
              !trimmed.endsWith('{') && 
              !trimmed.endsWith('}') && 
              !trimmed.endsWith(';') && 
              !trimmed.includes('if (') && 
              !trimmed.includes('else') && 
              !trimmed.includes('for (') && 
              !trimmed.includes('while (') && 
              !trimmed.includes('switch (') && 
              !trimmed.includes('do') &&
              !trimmed.includes('case ') &&
              !trimmed.includes('default:') &&
              trimmed.length > 3 &&
              (trimmed.includes('printf') || 
               trimmed.includes('scanf') || 
               trimmed.includes('=') || 
               trimmed.includes('++') || 
               trimmed.includes('--'))) {
            warnings.push(`💡 Line ${index + 1}: Possible missing semicolon - "${trimmed}"`);
          }
        });
        
        // Check for return statement in main
        if (code.includes('int main') && !code.includes('return')) {
          warnings.push('💡 Consider adding a return statement in main function (return 0;)');
        }
        
        // Check for common C functions without proper includes
        if (code.includes('printf') && !code.includes('#include <stdio.h>')) {
          errors.push('⚠️  printf() requires #include <stdio.h>');
        }
        if (code.includes('scanf') && !code.includes('#include <stdio.h>')) {
          errors.push('⚠️  scanf() requires #include <stdio.h>');
        }
        if (code.includes('malloc') && !code.includes('#include <stdlib.h>')) {
          errors.push('⚠️  malloc() requires #include <stdlib.h>');
        }
        if (code.includes('strlen') && !code.includes('#include <string.h>')) {
          errors.push('⚠️  strlen() requires #include <string.h>');
        }
        
        // Combine errors and warnings
        return [...errors, ...warnings];
      }

      // Function to fetch and display task
      async function fetchTask() {
        // Don't fetch new tasks if game has ended or computer is dead
        if (gameState.gameEnded || gameState.computerDead) {
          return;
        }
        
        try {
          // Fetch Level 3 challenges (Loops)
          const response = await fetch('http://localhost:5000/get-challenge?level=3');
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          const taskDescription = document.getElementById('taskDescription');
          taskDescription.value = 
              data.challenge + '\n\n' +
              '----------------------------------------\n' +
              'Submit your code in the box on the right.\n' +
              'Results will appear here after submission.';
          taskDescription.classList.remove('error');
          
          // Ensure total tasks is set to 5
          if (gameState.totalTasks === 0) {
            gameState.totalTasks = 5;
          }
        } catch (error) {
          console.error('Error fetching task:', error);

          if (!gameState.gameEnded && !gameState.computerDead) {
          const taskDescription = document.getElementById('taskDescription');

              'Error loading task...\n\n' +
              '----------------------------------------\n' +
              'Error details:\n' +
              error.message + '\n\n' +
              'Please make sure the server is running at http://localhost:5000';

      // Show scoreboard when all tasks are completed or game ends
      function showScoreboard(gameResult = null, isWin = false) {
        const scoreboard = document.getElementById('scoreboard');
        const scoreboardTitle = document.querySelector('.scoreboard-title');
        const scoreValue = document.getElementById('scoreValue');
        const tasksList = document.getElementById('tasksList');
        const tasksCompleted = document.getElementById('tasksCompleted');
        const completionRate = document.getElementById('completionRate');
        const completionMessage = document.querySelector('.completion-message');
        
        // Update title based on game result
        if (gameResult) {
          scoreboardTitle.textContent = gameResult;
          if (isWin) {
            scoreboardTitle.style.color = '#10b981';
            scoreboardTitle.style.textShadow = '0 0 20px rgba(16, 185, 129, 0.8)';
          } else {
            scoreboardTitle.style.color = '#ef4444';
            scoreboardTitle.style.textShadow = '0 0 20px rgba(239, 68, 68, 0.8)';
          }
        } else {
          scoreboardTitle.textContent = '🎉 Mission Complete! 🎉';
          scoreboardTitle.style.color = '#3b82f6';
          scoreboardTitle.style.textShadow = '0 0 20px rgba(59, 130, 246, 0.8)';
        }
        
        // Calculate score (100 points per task + bonus for win)
        const totalTasks = gameState.totalTasks || 5;
        const completedTasks = gameState.completedTasks.length;
        let score = completedTasks * 100;
        if (isWin && computer.health <= 0) {
          score += 200; // Bonus for winning
        }
        const rate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

        const completionTime = Math.floor((Date.now() - GAME_START_TIME) / 1000);
        const userId = localStorage.getItem('userId');
        if (!levelResultSaved && window.dbConnector && userId) {
          levelResultSaved = true;
          window.dbConnector.saveLevelCompletion(CURRENT_LEVEL, completionTime, score);
        }
        
        // Animate score counting
        let currentScore = 0;
        const scoreInterval = setInterval(() => {
          currentScore += 10;
          if (currentScore >= score) {
            currentScore = score;
            clearInterval(scoreInterval);
          }
          scoreValue.textContent = currentScore;
        }, 30);
        
        // Populate tasks list
        tasksList.innerHTML = '';
        if (gameState.completedTasks.length > 0) {
          gameState.completedTasks.forEach((task, index) => {
            const taskItem = document.createElement('div');
            taskItem.className = 'task-item';
            taskItem.innerHTML = `
              <span class="task-name">${task}</span>
              <span class="task-status">âœ“ Completed</span>
            `;
            tasksList.appendChild(taskItem);
          });
        } else {
          // Show message if no tasks completed
          const noTasksItem = document.createElement('div');
          noTasksItem.className = 'task-item';
          noTasksItem.innerHTML = `
            <span class="task-name">No tasks completed yet</span>
            <span class="task-status">Keep trying!</span>
          `;
          tasksList.appendChild(noTasksItem);
        }
        
        // Update stats
        tasksCompleted.textContent = completedTasks;
        completionRate.textContent = rate + '%';
        
        // Update completion message
        if (isWin) {
          completionMessage.textContent = '✨ Congratulations! You\'ve completed the challenge! ✨';
          completionMessage.style.borderColor = '#10b981';
          completionMessage.style.color = '#10b981';
        } else if (gameResult && !isWin) {
          completionMessage.textContent = '💪 Don\'t give up! Try again to improve your score! 💪';
          completionMessage.style.borderColor = '#ef4444';
          completionMessage.style.color = '#ef4444';
        } else {
          completionMessage.textContent = '✨ Congratulations! You\'ve mastered all the C programming basics! ✨';
          completionMessage.style.borderColor = '#10b981';
          completionMessage.style.color = '#10b981';
        }
        
        // Add action buttons based on win/loss

        if (isWin) {
          // Player wins: Show Next Level, Home, Retry, and Error History options

          nextLevelBtn.className = 'action-btn btn-new-level';
          nextLevelBtn.textContent = `⭐ Level ${gameState.currentLevel + 1}`;

          actionButtons.appendChild(homeBtn);

          retryBtn.textContent = '🔄 Retry';

            errorHistoryBtn.textContent = '📋 Error History';

    <script>
        const videoModal = document.getElementById('videoModal');
        const tutorialVideo = document.getElementById('tutorialVideo');
        const closeVideoBtn = document.getElementById('closeVideo');

        function showTutorialVideo() {
            // Detect if running through server or directly
            const isServerMode = window.location.protocol === 'http:' && 
                                 (window.location.hostname === 'localhost' || 
                                  window.location.hostname === '127.0.0.1');
            
            // Set the correct video path based on mode
            const videoSource = document.getElementById('videoSource');
            if (isServerMode) {
                // Running through server - use server endpoint
                videoSource.src = '/tutorial/level3_tutorial.mp4';
            } else {
                // Opening file directly - use relative path
                videoSource.src = '../level3_tutorial.mp4';
            }
            
            console.log('Video source set to:', videoSource.src);
            console.log('Server mode:', isServerMode);
            
            // Show modal first
            videoModal.classList.add('show');
            
            // Reset video state
            tutorialVideo.pause();
            tutorialVideo.currentTime = 0;
            tutorialVideo.muted = false;
            
            // Load the video
            tutorialVideo.load();
            
            // Wait for video to be ready before playing
            tutorialVideo.addEventListener('loadeddata', function playWhenReady() {
                // Remove this listener after first use
                tutorialVideo.removeEventListener('loadeddata', playWhenReady);
                console.log('Video data loaded, duration:', tutorialVideo.duration);
                
                // Now try to play
                const playPromise = tutorialVideo.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('Video playing successfully');
                        // Try fullscreen after video starts
                        setTimeout(() => {
                            if (tutorialVideo.requestFullscreen) {
                                tutorialVideo.requestFullscreen().catch(err => {
                                    console.log('Fullscreen request failed:', err);
                                });
                            }
                        }, 500);
                    }).catch(error => {
                        console.error('Play failed:', error);
                        // If autoplay fails, try with muted
                        tutorialVideo.muted = true;
                        tutorialVideo.play().catch(e => {
                            console.error('Muted play also failed:', e);
                        });
                    });
                }
            }, { once: true });
            
            // Fallback: if video doesn't load in 3 seconds, try to play anyway
            setTimeout(() => {
                console.log('Ready state:', tutorialVideo.readyState);
                if (tutorialVideo.paused && tutorialVideo.readyState >= 2) {
                    tutorialVideo.play().catch(err => console.log('Fallback play failed:', err));
                }
            }, 3000);
            
            // Error handling
            tutorialVideo.addEventListener('error', (e) => {
                console.error('Video error:', e);
                alert('Video failed to load. Please check console for details.\n\nMake sure you are accessing the game through the server (http://localhost:5000/).');
            });
        }

        function closeTutorialVideo() {
            // Pause video first
            tutorialVideo.pause();
            
            // Exit fullscreen if active
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(err => console.log('Exit fullscreen failed:', err));
            }
            
            // Hide modal
            videoModal.classList.remove('show');
            
            // Reset video
            tutorialVideo.currentTime = 0;
            tutorialVideo.muted = false;
        }

        closeVideoBtn.addEventListener('click', closeTutorialVideo);
        videoModal.addEventListener('click', (e) => { 
            if (e.target === videoModal) {
                closeTutorialVideo(); 
            }
        });
        tutorialVideo.addEventListener('ended', closeTutorialVideo);
        
        // Make function globally available
        window.showTutorialVideo = showTutorialVideo;
    </script>
